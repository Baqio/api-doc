name: Deploy API documentation

on:
  push:
    branches: [master]
    paths:
      - 'Baqio-Public-API.v1.json'
      - 'api-reference/**'
      - '.github/workflows/api-docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static documentation
        run: |
          mkdir -p dist
          cp api-reference/index.html dist/index.html
          cp Baqio-Public-API.v1.json dist/openapi.json
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
