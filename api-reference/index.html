<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Documentation interactive de l'API publique Baqio" />
    <meta name="theme-color" content="#111827" />
    <title>Baqio Public API — Documentation</title>
    <style>
      html, body, #app { height: 100%; margin: 0; }
      body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .light-mode {
        --scalar-color-accent: #7c3aed;
        --scalar-background-accent: rgba(124, 58, 237, .08);
      }
      .dark-mode {
        --scalar-color-accent: #a78bfa;
        --scalar-background-accent: rgba(167, 139, 250, .12);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.67.0"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: './openapi.json',
        pageTitle: 'Baqio Public API — Documentation',
        theme: 'default',
        layout: 'modern',
        hideClientButton: false,
        showSidebar: true,
        showOperationId: false,
        defaultOpenAllTags: false,
        persistAuth: true,
        hideModels: false,
        withDefaultFonts: true,
        servers: [
          { url: 'https://app.baqio.com/api/v1', description: 'Production' },
          { url: 'https://demo.baqio.com/api/v1', description: 'Démo' }
        ]
      })
    </script>
  </body>
</html>
